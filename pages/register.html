<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create an account with Muskverse Equity to get started investing."
    />
    <title>Muskverse Equity | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../style-overrides.css" />
    <link rel="stylesheet" href="../style-theme.css" />
    <style>
      :root {
        --brand: #5156be;
        --bg: #f5f5fc;
        --panel: #ffffff;
        --line: #e6e9f2;
        --heading: #111827;
        --text: #2c3131;
        --muted: #636d79;
        --muted-2: #526179;
        --shadow: rgba(40, 45, 90, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      a { text-decoration: none; }

      .auth-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      .auth-header {
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #111827;
        font-family: "Space Grotesk", sans-serif;
      }

      .brand span {
        color: #111827;
      }

      .btn-signup {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        border-radius: 6px;
        height: 44px;
        padding: 0 26px;
        font-size: 15px;
      }

      .btn-signup:hover {
        opacity: 0.92;
      }

      .auth-main {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 80px 20px;
      }

      .auth-card {
        background: var(--panel);
        width: 100%;
        max-width: 800px;
        border-radius: 14px;
        box-shadow: 0 10px 40px var(--shadow);
        padding: 44px 56px 52px;
      }

      .auth-card h1 {
        text-align: center;
        font-weight: 700;
        font-size: 30px;
        color: var(--heading);
        margin: 0;
      }

      .auth-sub {
        text-align: center;
        color: var(--muted);
        font-size: 15px;
        margin-top: 8px;
      }

      .auth-divider {
        border: none;
        border-top: 1px solid #eef0f4;
        margin: 26px 0 30px;
      }

      .auth-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0 32px;
      }

      .auth-field {
        margin-bottom: 22px;
      }

      .auth-field label {
        display: block;
        font-size: 14px;
        color: var(--muted-2);
        margin-bottom: 10px;
      }

      .auth-input {
        position: relative;
      }

      .auth-input input,
      .auth-input select {
        width: 100%;
        height: 52px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 16px;
        font-size: 15px;
        font-family: inherit;
        color: var(--text);
        background: #fff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .auth-input input::placeholder {
        color: #9aa1ac;
      }

      .auth-input input:focus,
      .auth-input select:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(81, 86, 190, 0.12);
      }

      .checkbox-row {
        grid-column: 1 / -1;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 2px 0 12px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .checkbox-row input {
        width: 16px;
        height: 16px;
        margin-top: 2px;
        accent-color: var(--brand);
      }

      .checkbox-row a,
      .auth-foot a {
        color: var(--brand);
        font-weight: 600;
        text-decoration: underline;
      }

      .submit-btn {
        width: 100%;
        height: 52px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .submit-btn:hover {
        opacity: 0.93;
      }

      .auth-foot {
        text-align: center;
        margin-top: 22px;
        color: var(--muted);
        font-size: 14px;
      }

      @media (min-width: 768px) {
        .auth-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 640px) {
        .auth-header {
          padding: 16px 20px;
        }

        .auth-card {
          padding: 30px 22px 36px;
        }

        .auth-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <header class="auth-header">
        <a href="../index.html#top" aria-label="Muskverse Equity home" class="brand">
          <span>Muskverse</span><span>&nbsp;Equity</span>
        </a>
        <a href="../index.html#contact" class="btn-signup">Sign In</a>
      </header>

      <main class="auth-main">
        <div class="auth-card wide">
          <h1>Create an Account</h1>
          <p class="auth-sub">Please provide your information to create an account</p>
          <hr class="auth-divider" />

          <form method="post" action="#">
            <div class="auth-grid">
              <div class="auth-field">
                <label for="first_name">First Name</label>
                <div class="auth-input">
                  <input id="first_name" name="first_name" type="text" placeholder="Enter First Name" autocomplete="given-name" required />
                </div>
              </div>

              <div class="auth-field">
                <label for="last_name">Last Name</label>
                <div class="auth-input">
                  <input id="last_name" name="last_name" type="text" placeholder="Enter Last Name" autocomplete="family-name" required />
                </div>
              </div>

              <div class="auth-field">
                <label for="username">Username</label>
                <div class="auth-input">
                  <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required />
                </div>
              </div>

              <div class="auth-field">
                <label for="email">Email address</label>
                <div class="auth-input">
                  <input id="email" name="email" type="email" placeholder="Enter email address" autocomplete="email" required />
                </div>
              </div>

              <div class="auth-field">
                <label for="phone">Phone Number</label>
                <div class="auth-input">
                  <input id="phone" name="phone" type="tel" placeholder="Enter your phone number" required />
                </div>
              </div>

              <div class="auth-field">
                <label for="country">Country</label>
                <div class="auth-input">
                  <select id="country" name="country" required>
                    <option selected disabled>Select your country</option>
                    <option>United States</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>
                    <option>Australia</option>
                    <option>Germany</option>
                    <option>France</option>
                    <option>India</option>
                    <option>South Africa</option>
                    <option>Brazil</option>
                    <option>Mexico</option>
                  </select>
                </div>
              </div>

              <div class="auth-field" style="grid-column: 1 / -1;">
                <label for="password">Password</label>
                <div class="auth-input">
                  <input id="password" name="password" type="password" placeholder="Enter password" required />
                </div>
              </div>

              <div class="auth-field" style="grid-column: 1 / -1;">
                <label for="confirm_password">Confirm password</label>
                <div class="auth-input">
                  <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required />
                </div>
              </div>

              <div class="auth-field" style="grid-column: 1 / -1;">
                <label for="referral_id">Referral ID (Optional)</label>
                <div class="auth-input">
                  <input id="referral_id" name="referral_id" type="text" placeholder="Optional referral code" />
                </div>
              </div>

              <label class="checkbox-row">
                <input type="checkbox" name="accept_terms" />
                <span>I accept the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
              </label>

              <button type="submit" class="submit-btn">Create Account</button>
            </div>
          </form>

          <div class="auth-foot">
            Already have an account? <a href="../index.html#contact">Sign in</a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
