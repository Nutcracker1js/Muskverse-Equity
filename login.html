<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your Muskverse Equity account."
    />
    <title>Muskverse Equity | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/main.css" />
  </head>
  <body class="auth-page">
    <header class="site-header" id="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html#top" aria-label="Muskverse Equity home"
          ><span>Muskverse Equity</a
        >
        <button
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          aria-pressed="false"
        >
          <svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path></svg
          ><svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
            ></path>
          </svg>
        </button>
        <a class="button button-small nav-login" href="register.html">Sign Up</a>
      </div>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="signin-heading">
        <h1 id="signin-heading">Sign in</h1>
        <p class="auth-subtitle">Sign in to access your account</p>
        <hr class="auth-divider" />
        <form class="auth-form" novalidate>
          <div class="auth-field">
            <label for="signin-username">Username or Email Address</label>
            <input
              type="text"
              id="signin-username"
              name="username"
              placeholder="you@example.com or username"
              autocomplete="username"
              required
            />
          </div>
          <div class="auth-field">
            <label for="signin-password">Password</label>
            <div class="auth-password-wrap">
              <input
                type="password"
                id="signin-password"
                name="password"
                placeholder="xxxxxxxx"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="auth-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg
                  class="eye-open"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  class="eye-closed"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <p class="auth-forgot"><a href="#">Forgot password?</a></p>
          <button type="submit" class="auth-submit">Sign in</button>
          <p class="auth-switch">
            Don't have an account? <a href="register.html">Sign up</a>
          </p>
        </form>
      </section>
    </main>

    <script src="assets/script.js"></script>
    <script src="assets/auth.js"></script>
  </body>
</html>
