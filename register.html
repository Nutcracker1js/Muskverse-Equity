        src="assets/images/signup.jpg"

              name="name"
              placeholder="Jane Doe"
              autocomplete="name"
              required
            />
          </div>
          <div class="auth-field">
            <label for="signup-email">Email Address</label>

              id="signup-email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="auth-field">
            <label for="signup-phone">Phone Number</label>

              id="signup-phone"
              name="phone"
              placeholder="+1 (555) 123-4567"
              autocomplete="tel"
              required
            />
          </div>
          <div class="auth-field">
            <label for="signup-address">Address</label>
            <input

              id="signup-address"
              name="address"
              placeholder="123 Main Street, Springfield"
              autocomplete="street-address"
              required
            />
          </div>

          <div class="auth-field">
            <label for="signup-password">Password</label>
            <div class="auth-password-wrap">
              <input
                type="password"
                id="signup-password"
                name="password"
                placeholder="xxxxxxxx"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button
                type="button"
                class="auth-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg
                  class="eye-open"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  class="eye-closed"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="auth-field">
            <label for="signup-confirm-password">Confirm Password</label>
            <div class="auth-password-wrap">
              <input
                type="password"
                id="signup-confirm-password"
                name="confirm-password"
                placeholder="xxxxxxxx"
                autocomplete="new-password"
                minlength="8"
                required
              />
              <button
                type="button"
                class="auth-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >

                  class="eye-open"
                  viewBox="0 0 24 24"
                  fill="none"
